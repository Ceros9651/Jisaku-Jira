<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 16px で整数ピクセルに乗る格子。3 列のボードに札が並ぶ -->
  <rect width="16" height="16" rx="3" fill="#1f5fbf"/>
  <g fill="#fff">
    <rect x="1" y="2" width="4" height="3"/>
    <rect x="1" y="6" width="4" height="3"/>
    <rect x="1" y="10" width="4" height="3"/>
    <rect x="6" y="2" width="4" height="3"/>
    <rect x="6" y="6" width="4" height="3"/>
    <rect x="11" y="2" width="4" height="3"/>
  </g>
</svg>
